<script>
(function () {
  if (!document.querySelector('.mermaid')) return;
  function setupFs() {
    document.querySelectorAll('.mermaid').forEach(function (host) {
      if (host.dataset.fs) return;
      host.dataset.fs = '1';
      host.style.position = 'relative';

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mermaid-fs-btn';
      btn.textContent = '⛶ 全屏';
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (!document.fullscreenElement) {
          var r = host.requestFullscreen || host.webkitRequestFullscreen;
          if (r) r.call(host);
        } else {
          var x = document.exitFullscreen || document.webkitExitFullscreen;
          if (x) x.call(document);
        }
      });
      host.appendChild(btn);

      var svg = host.querySelector('svg');
      if (!svg) return;

      var scale = 1, tx = 0, ty = 0, panning = false, sx = 0, sy = 0, stx = 0, sty = 0;
      function apply() {
        svg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
      }
      function reset() { scale = 1; tx = 0; ty = 0; apply(); }

      host.addEventListener('wheel', function (e) {
        if (document.fullscreenElement !== host) return;
        e.preventDefault();
        var rect = host.getBoundingClientRect();
        var cx = e.clientX - rect.left, cy = e.clientY - rect.top;
        var factor = e.deltaY < 0 ? 1.1 : 0.9;
        var ns = Math.min(Math.max(scale * factor, 0.3), 12);
        tx = cx - (cx - tx) * (ns / scale);
        ty = cy - (cy - ty) * (ns / scale);
        scale = ns;
        apply();
      }, { passive: false });

      host.addEventListener('mousedown', function (e) {
        if (document.fullscreenElement !== host) return;
        panning = true; sx = e.clientX; sy = e.clientY; stx = tx; sty = ty;
        svg.classList.add('grabbing');
      });
      window.addEventListener('mousemove', function (e) {
        if (!panning) return;
        tx = stx + (e.clientX - sx); ty = sty + (e.clientY - sy); apply();
      });
      window.addEventListener('mouseup', function () {
        panning = false; svg.classList.remove('grabbing');
      });
      document.addEventListener('fullscreenchange', reset);
    });
  }
  var tries = 0;
  var timer = setInterval(function () {
    tries++;
    if (document.querySelectorAll('.mermaid svg').length || tries > 40) {
      clearInterval(timer);
      setupFs();
    }
  }, 200);
})();
</script>

<script>
    function initCodeMoreBox() {
        let codeBlocks = document.querySelectorAll(".highlight");
        if (!codeBlocks) {
            return;
        }
        codeBlocks.forEach(codeBlock => {
            
            if (codeBlock.scrollHeight <= codeBlock.clientHeight) {
                return;
            }
            
            
            let codeMoreBox = document.createElement('div');
            codeMoreBox.classList.add('code-more-box');
            
            let codeMoreBtn = document.createElement('span');
            codeMoreBtn.classList.add('code-more-btn');
            codeMoreBtn.addEventListener('click', () => {
                codeBlock.classList.add('code-show');
                codeMoreBox.style.display = 'none';
                
                window.dispatchEvent(new Event('resize'))
            })
            
            let img = document.createElement('img');
            img.classList.add('code-more-img');
            img.src = "https://www.whysoso.com/icons/codeMore.png"
            
            codeMoreBtn.appendChild(img);
            codeMoreBox.appendChild(codeMoreBtn);
            codeBlock.appendChild(codeMoreBox)
        })
    }

    initCodeMoreBox();
</script>
